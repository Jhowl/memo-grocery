# memogrocery.home reverse proxy
#
# Serves the Vite frontend (port 8081) at /
# Proxies the FastAPI backend (port 8000) at /api/ and /uploads/
#
# Enable:
#   sudo ln -s /home/jh/docker/memo-grocery/nginx/memogrocery.conf /etc/nginx/sites-available/memogrocery
#   sudo ln -s /etc/nginx/sites-available/memogrocery /etc/nginx/sites-enabled/memogrocery
#   sudo nginx -t && sudo systemctl reload nginx

server {
  listen 80;
  server_name memogrocery.home;

  # Frontend
  location / {
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # API
  location /api/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Uploaded images
  location /uploads/ {
    proxy_pass http://127.0.0.1:8000/uploads/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
